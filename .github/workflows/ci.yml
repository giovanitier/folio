name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Run synthetic tests
        run: npm test
      - name: Validate Worker bundle without deployment
        run: npx --yes wrangler@4.145.0 deploy --dry-run --outdir /tmp/folio-worker-build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Smoke-test the local Workers runtime
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.145.0 dev --local --port 8787 > /tmp/folio-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/folio-health.json; then
              READY=1
              break
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              cat /tmp/folio-worker.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then
            cat /tmp/folio-worker.log
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:8787';
          const health = await (await fetch(base + '/api/health')).json();
          assert.equal(health.version, '0.3.0');
          assert.equal(health.secConfigured, false);
          assert.equal(health.upstream, 'not_checked');
          const directory = await (await fetch(base + '/api/investors')).json();
          assert.equal(directory.investors.length, 5);
          for (const path of ['/', '/app.js', '/model.js', '/styles.css', '/vendor/syntari/runtime/tokens.css']) {
            const response = await fetch(base + path);
            assert.equal(response.status, 200, path);
            assert.equal(response.headers.get('X-Folio-Version'), '0.3.0', path);
          }
          const guarded = await fetch(base + '/api/dashboard');
          assert.equal(guarded.status, 503);
          assert.equal((await guarded.json()).code, 'SEC_NOT_CONFIGURED');
          for (const path of ['/worker.mjs', '/tests/fixtures.mjs', '/.dev.vars', '/__folio_cache__/v2/berkshire']) {
            assert.equal((await fetch(base + path)).status, 404, path);
          }
          console.log('Local Workers runtime smoke checks passed. No live SEC requests were made.');
          NODE
